<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <!-- полосы газона -->
  <g fill="#ffffff" fill-opacity="0.035">
    <rect x="0" y="0" width="150" height="700"/>
    <rect x="300" y="0" width="150" height="700"/>
    <rect x="600" y="0" width="150" height="700"/>
