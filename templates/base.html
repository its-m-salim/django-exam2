{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Онлайн синема{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'base.css' %}">
    {% block css %}{% endblock %}
</head>
<body>
    <header>
        {% if user.is_authenticated %}
        <a href="/">Главная</a>
        <a href="/fields/">Поля</a>
        <a href="/play-together/">Играем вместе</a>
        <a href="/my_fields/">Мои поля</a>
        <a href="/profile/">Профиль</a>
        <a href="/logout">выход</a>
        {% else %}
        <a href="/">Главная</a>
        <a href="/login/">Вход</a>
        <a href="/register/">Регистрация</a>
        {% endif %}
    </header>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
