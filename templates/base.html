<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Аренда футбольных полей{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'home' %}">Главная</a>
            {% if user.is_authenticated %}
                <a href="{% url 'fields' %}">fields</a>
                <a href="{% url 'play_together' %}">play play-together</a>
                <a href="{% url 'my_fields' %}">my fields</a>
                <a href="{% url 'profile' %}">profilre</a>
                <a href="{% url 'logout' %}">quit</a>
            {% else %}
                <a href="{% url 'login' %}">login</a>
                <a href="{% url 'registration' %}">register</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
