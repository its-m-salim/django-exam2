{% extends 'base.html' %}

{% block title %}Заказ поля{% endblock %}

{% block content %}
<h1>Заказать поле</h1>
<form method="post">
    {% csrf_token %}
    <p><label>have team?
        <select name="has_team" required>
            <option value="True">yes</option>
            <option value="False">no</option>
        </select>
    </label></p>
    <p><label>players needed
        <input type="number" name="players_needed" min="0" max="22" value="0">
    </label></p>
    <button type="submit">save</button>
</form>
<a href="{% url 'fields' %}">back</a>
{% endblock %}
